<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity iOS Node</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .status { font-size: 1.5rem; color: #00f2fe; margin-bottom: 1rem; }
        .hint { opacity: 0.5; font-size: 0.8rem; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="status" id="status">iOS Node: INITIALIZING</div>
    <div id="log" style="font-size: 0.7rem; opacity: 0.7;"></div>
    <div class="hint">Keep this tab open or add to Home Screen. Browser workers will report telemetry as long as the app is active.</div>

    <script>
        const RENDER_URL = "https://analiz-projesi-2024-bnb.onrender.com";
        const DEVICE_ID = "iOS_Device_" + Math.random().toString(36).substring(7);

        function sendTelemetry() {
            fetch(`${RENDER_URL}/update`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    device_id: DEVICE_ID,
                    status: "ACTIVE_iOS",
                    temp: 0,
                    threads: 1,
                    timestamp: Date.now() / 1000
                })
            })
            .then(() => {
                document.getElementById('status').innerText = "iOS Node: ACTIVE";
                document.getElementById('status').style.color = "#00ff88";
            })
            .catch(err => {
                document.getElementById('status').innerText = "iOS Node: OFFLINE";
                document.getElementById('status').style.color = "#ff4b2b";
            });
        }

        setInterval(sendTelemetry, 20000);
        sendTelemetry();
    </script>
</body>
</html>
